<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101525" />
    <title>Hello, world!</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #101525;
        color: #f7f8ff;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(ellipse at 50% 0%, rgba(116, 92, 255, 0.28), transparent 55%),
          #101525;
      }

      main {
        width: min(100%, 680px);
        padding: clamp(36px, 8vw, 72px) 28px;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.045);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.28);
      }

      .eyebrow {
        margin: 0 0 18px;
        color: #a99aff;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(3rem, 11vw, 6rem);
        line-height: 1;
        letter-spacing: -0.07em;
      }

      h1 span {
        color: #a99aff;
      }

      .message {
        margin: 24px 0 0;
        color: #b8bfd2;
        font-size: clamp(1rem, 2.6vw, 1.2rem);
        line-height: 1.6;
      }

      .sparkle {
        display: inline-block;
        margin-top: 32px;
        font-size: 1.5rem;
        animation: float 2.4s ease-in-out infinite;
      }

      @keyframes float {
        50% { transform: translateY(-7px) rotate(8deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">A little page, a big beginning</p>
      <h1>Hello,<br /><span>world!</span></h1>
      <p class="message">Your first page is ready. The next idea starts here.</p>
      <span class="sparkle" aria-hidden="true">✦</span>
    </main>
  </body>
</html>
